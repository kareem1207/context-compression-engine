name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "cce_sdk_js/lite.js", "cce_sdk_js/sample.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (the demo uses the same engine file as the npm package)
        run: |
          mkdir site
          cp docs/* site/
          cp cce_sdk_js/lite.js cce_sdk_js/sample.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
