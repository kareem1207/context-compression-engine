name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: uv sync
      # test_e2e_gemma.py needs a running llama.cpp server, so it is skipped here.
      - run: uv run pytest -q --ignore=tests/test_e2e_gemma.py

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cce_sdk_js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
