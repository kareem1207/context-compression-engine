name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: uv sync
      # test_e2e_gemma.py needs a running llama.cpp server, so it is skipped here.
      - run: uv run pytest -q --ignore=tests/test_e2e_gemma.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the wheel and sdist
        run: uv build --out-dir dist
      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          uv venv --python 3.12 /tmp/clean
          uv pip install --python /tmp/clean/bin/python "$(ls dist/*.whl)[rest,mcp,ui]"
          cd /tmp
          /tmp/clean/bin/cce-rest --help
          /tmp/clean/bin/cce-mcp --help
          /tmp/clean/bin/cce-ui --help
          /tmp/clean/bin/python -I -c "import cce_core, cce_mcp.server, cce_rest.app, cce_ui; from importlib.resources import files; assert files('cce_ui').joinpath('dashboard.html').is_file()"

  recall-gate:
    # Model-free recall on real chat text with the neural embedder. It fails when CCE stops finding the
    # facts it used to find (it would have caught the token-counter regression that cost 8 of 96 questions).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache the embedding model and the chat data
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-ultrachat
      - run: uv sync --group bench
      - name: Recall, 3 pinned conversations (seeds 508-510; seed 510 holds the message that broke it)
        run: uv run --group bench python benchmarks/retrieval_recall.py --conversations 3 --seed-start 508 --top-k 5 --variants cce,cce_hash --min cce=0.95 --min cce_hash=0.5
      - name: Live sessions, 2 pinned conversations (one-shot, live, restart, crash)
        run: uv run --group bench python benchmarks/retrieval_live.py --conversations 2 --seed-start 509 --top-k 5 --modes oneshot,live,live_restart,live_crash --min oneshot=0.95 --min live=0.95 --min live_restart=0.9 --min live_crash=0.95

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cce_sdk_js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
