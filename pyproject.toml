[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "context-compression-engine"
version = "1.0.0"
description = "Memory for AI assistants: compress long conversations into topic notes and send a model only the context it needs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shaik Kareem" }]
requires-python = ">=3.12"
keywords = ["llm", "memory", "context", "compression", "mcp", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The engine itself. Light: the neural embedder is an optional extra.
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3.0"]
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23"]
rest = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
mcp = ["mcp>=1.2,<2", "pydantic>=2.6"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
tokens = ["tiktoken>=0.7"]
encrypt = ["cryptography>=42"]
all = ["context-compression-engine[neural,onnx,rest,mcp,ui]"]

[project.scripts]
cce-rest = "cce_rest.app:main"
cce-mcp = "cce_mcp.server:main"
cce-ui = "cce_ui.cli:main"
cce = "cce_core.cli:main"
cce-proxy = "cce_proxy.app:main"

[project.urls]
Homepage = "https://kareem1207.github.io/context-compression-engine/"
Source = "https://github.com/kareem1207/context-compression-engine"
Issues = "https://github.com/kareem1207/context-compression-engine/issues"

[dependency-groups]
# `uv sync` installs this group, so a fresh clone can run every test and demo.
dev = [
    "pytest>=8.0",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mcp>=1.2,<2",
]
bench = ["pyarrow>=15"]

[tool.hatch.build.targets.wheel]
packages = ["cce_core", "cce_mcp", "cce_rest", "cce_ui", "cce_proxy", "cce_integrations"]

[tool.hatch.build.targets.sdist]
include = ["cce_core", "cce_mcp", "cce_rest", "cce_ui", "cce_proxy", "cce_integrations", "README.md", "LICENSE", "pyproject.toml"]
